[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-cli"
version = "1.0.0"
description = "Hermes-Notebook Grounded RAG & Multi-Agent CLI Suite"
authors = [{ name = "Antigravity AI Engineering Division" }]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
antigravity-rag = "antigravity_cli.cli:app"
