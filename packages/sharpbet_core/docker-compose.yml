version: "3.8"

services:
  sharpbet-core:
    build:
      context: ../..
      dockerfile: packages/sharpbet_core/Dockerfile
    container_name: sharpbet-core-api
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
