[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judgeguard-mcp-server"
version = "1.0.0"
description = "Authoritative Autonomous AI Governance & Alexa+ MCP Bridge with Mandatory NotebookLM RAG"
readme = "README.md"
authors = [{ name = "JudgeGuard Core Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0"
]

[project.scripts]
judgeguard-mcp = "judgeguard_mcp_server.server:main"
